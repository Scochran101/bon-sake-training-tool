name: Smoke test

# Gates every push: the single-file app must parse, boot, and keep its pure
# helpers working before Vercel deploys it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install jsdom --no-save
      - run: node test/smoke.mjs
