<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Bon Sake Inventory</title>
<link rel="icon" href="logo.png">
<style>
  /* Self-contained on purpose: this page shares NO code or styles with the
     training app, so an inventory change can never break training.
     Palette mirrors the Ops app: #0A0A0A ground, #C9A84C gold. */
  :root {
    --paper:#0A0A0A; --card:#161513; --ink:#efe8d8; --muted:#9a917c;
    --line:#2a2822; --accent:#C9A84C; --accent-soft:#241d0c; --golddim:#9c8a52;
    --good:#5cbb8a; --good-soft:#12301f; --warn:#e0a33b; --warn-soft:#3a2b10;
    --bad:#e26d6d; --bad-soft:#3a1515;
    --z1:#3e6cb8; --z1-soft:#141f33; --z2:#35945f; --z2-soft:#0f281a;
    color-scheme: dark;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; }
  body { background:var(--paper); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         font-size:16px; line-height:1.45; padding-bottom:env(safe-area-inset-bottom); }
  button { font:inherit; border:none; cursor:pointer; background:none; color:inherit; }
  input,select,textarea { font:inherit; color:inherit; }
  .hidden { display:none !important; }

  /* Banners stack at the very top */
  #banners { position:sticky; top:0; z-index:60; }
  .banner { padding:9px 14px; font-size:13.5px; font-weight:600; text-align:center; }
  .banner button { text-decoration:underline; font-weight:700; margin-left:8px; }
  .banner.demo { background:#3b3358; color:#fff; }
  .banner.warn { background:var(--warn-soft); color:var(--warn); }
  .banner.bad  { background:var(--bad-soft); color:var(--bad); }
  .banner.info { background:var(--accent-soft); color:var(--accent); }

  /* App header */
  header.app { position:sticky; top:0; z-index:50; background:var(--card); border-bottom:1px solid var(--line);
               display:flex; align-items:center; gap:8px; padding:10px 12px; }
  header.app .back { font-size:22px; padding:4px 10px 4px 2px; color:var(--muted); }
  header.app .hlogo { width:26px; height:26px; border-radius:6px; object-fit:cover; }
  header.app h1 { font-size:17px; font-weight:700; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .opsbtn { border:1px solid var(--golddim); color:var(--accent); font-size:12px; font-weight:700;
            letter-spacing:.08em; text-transform:uppercase; border-radius:999px; padding:5px 12px; }
  #chip { font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px; white-space:nowrap; }
  #chip.ok   { background:var(--good-soft); color:var(--good); }
  #chip.busy { background:var(--accent-soft); color:var(--accent); }
  #chip.wait { background:var(--warn-soft); color:var(--warn); }

  main { padding:14px; max-width:640px; margin:0 auto; }

  /* Login */
  .login-wrap { min-height:88vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:12px; }
  .login-wrap img { width:84px; height:84px; object-fit:contain; }
  .login-wrap h1 { font-size:22px; margin:2px 0 0; }
  .login-wrap p.sub { color:var(--muted); margin:0 0 8px; font-size:14px; }
  .pin-input { font-size:30px; letter-spacing:12px; text-align:center; width:230px; padding:10px;
               border:2px solid var(--line); border-radius:12px; background:var(--card); }
  .name-row { display:flex; gap:8px; }
  .name-row input { flex:1; min-width:0; padding:10px; border:2px solid var(--line); border-radius:10px; background:var(--card); }
  .err { color:var(--bad); font-size:14px; font-weight:600; min-height:20px; text-align:center; }

  /* Big menu buttons */
  .bigbtn { display:flex; align-items:center; gap:14px; width:100%; background:var(--card); border:1px solid var(--line);
            border-radius:14px; padding:16px; margin-bottom:12px; text-align:left; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .bigbtn .ico { font-size:26px; }
  .bigbtn .t { font-size:17px; font-weight:700; }
  .bigbtn .s { font-size:13px; color:var(--muted); }
  .primary { background:var(--accent); color:#0A0A0A; border-radius:12px; padding:14px 18px; font-weight:700; font-size:16px; width:100%; }
  .primary:disabled { opacity:.5; }
  .ghost { border:1px solid var(--line); background:var(--card); border-radius:12px; padding:12px 16px; font-weight:600; width:100%; }

  /* Zone cards + banner */
  .zone-card { border-radius:14px; padding:20px 16px; margin-bottom:12px; color:#fff; width:100%; text-align:left; }
  .zone-card .t { font-size:19px; font-weight:800; }
  .zone-card .s { font-size:13px; opacity:.9; }
  #zonebanner { position:sticky; top:49px; z-index:45; color:#fff; font-weight:800; font-size:15px;
                padding:10px 14px; display:flex; justify-content:space-between; align-items:center; }
  #zonebanner .sw { font-size:12.5px; font-weight:700; background:rgba(255,255,255,.22); border-radius:999px; padding:4px 10px; }

  /* Count list */
  .cat-head { display:flex; justify-content:space-between; align-items:baseline; margin:18px 2px 6px; }
  .cat-head h3 { margin:0; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .cat-head .prog { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .prow { display:flex; align-items:center; width:100%; background:var(--card); border:1px solid var(--line);
          border-radius:12px; padding:12px 14px; margin-bottom:8px; text-align:left; }
  .prow .nm { flex:1; font-weight:600; font-size:15.5px; padding-right:8px; }
  .prow .un { font-size:11.5px; color:var(--muted); margin-left:6px; font-weight:500; }
  .prow .qty { font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; min-width:56px; text-align:right; }
  .prow .qty.zero { color:var(--muted); font-weight:600; }
  .prow.touched { border-color:var(--accent); }
  .prow.sel { border-color:var(--accent); background:var(--accent-soft); }
  .prow .tick { font-size:19px; margin-right:10px; color:var(--accent); }
  #selbar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line);
            padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:center; z-index:70; }
  #selbar .cnt { font-weight:700; font-size:14px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  #selbar input { flex:1; min-width:0; padding:9px 10px; border:1px solid var(--line); border-radius:9px; background:#101010; color:var(--ink); }
  #selbar .primary { width:auto; padding:10px 16px; }
  .searchbar { width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card); margin-bottom:4px; }

  /* Keypad overlay */
  .overlay { position:fixed; inset:0; background:rgba(20,23,28,.55); z-index:80; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:var(--card); border-radius:18px 18px 0 0; width:100%; max-width:640px; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); }
  .kp-head { text-align:center; margin-bottom:6px; }
  .kp-head .nm { font-weight:800; font-size:17px; }
  .kp-head .pv { color:var(--muted); font-size:13px; }
  .kp-entry { text-align:center; font-size:40px; font-weight:800; font-variant-numeric:tabular-nums; padding:6px 0 10px; min-height:58px; }
  .kp-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .kp-grid button { background:#1d1b17; border:1px solid var(--line); border-radius:12px; font-size:24px; font-weight:700; padding:14px 0; }
  .tenths { display:grid; grid-template-columns:repeat(9,1fr); gap:5px; margin:10px 0 8px; }
  .tenths.quarters { grid-template-columns:repeat(3,1fr); }
  .tenths.quarters button { font-size:16px; padding:12px 0; }
  .tenths button { background:var(--accent-soft); color:var(--accent); border-radius:9px; font-size:13.5px; font-weight:700; padding:10px 0; }
  .kp-actions { display:flex; gap:8px; margin-top:10px; }
  .kp-actions .primary { flex:2; width:auto; }
  .kp-actions .ghost { flex:1; width:auto; }

  /* Forms + cards */
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:11.5px; font-weight:700; color:var(--golddim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; }
  .field input, .field select, .field textarea { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#101010; color:var(--ink); }
  .row2 { display:flex; gap:10px; } .row2 > * { flex:1; min-width:0; }

  /* Tables (reports, review) */
  .tscroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; background:var(--card); border-radius:12px; overflow:hidden; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
       padding:9px 10px; border-bottom:1px solid var(--line); background:#12110f; }
  td { padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; }
  th.n { text-align:right; }
  .flag { display:inline-block; font-size:11px; font-weight:700; border-radius:6px; padding:2px 7px; margin-left:6px; }
  .flag.warn { background:var(--warn-soft); color:var(--warn); }
  .flag.bad { background:var(--bad-soft); color:var(--bad); }
  .tabsbar { display:flex; gap:6px; margin-bottom:12px; }
  .tabsbar button { flex:1; padding:10px 4px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-weight:700; font-size:13.5px; color:var(--muted); }
  .tabsbar button.on { background:var(--accent); border-color:var(--accent); color:#fff; }

  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom));
           background:var(--ink); color:#0A0A0A; font-size:14px; font-weight:600; padding:11px 18px; border-radius:12px;
           z-index:100; max-width:90vw; text-align:center; }
  .muted { color:var(--muted); } .small { font-size:13px; }
  h2.sec { font-size:19px; margin:4px 0 12px; }
  .listline { display:flex; justify-content:space-between; align-items:center; padding:10px 2px; border-bottom:1px solid var(--line); font-size:14.5px; }
  .listline:last-child { border-bottom:none; }
  .linkbtn { color:var(--accent); font-weight:700; font-size:13.5px; }
  .danger { color:var(--bad); }
</style>
</head>
<body>

<div id="banners"></div>

<!-- ============ LOGIN ============ -->
<section id="view-login" class="login-wrap hidden">
  <img src="logo.png" alt="Bon Sake">
  <h1>Bar Inventory</h1>
  <p class="sub">Enter your PIN. Same one as the training app.</p>
  <input id="pin" class="pin-input" type="tel" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="•••••">
  <div id="namerow" class="name-row hidden">
    <input id="pin-first" placeholder="First name" autocomplete="off">
    <input id="pin-last" placeholder="Last name" autocomplete="off">
  </div>
  <div id="login-err" class="err"></div>
  <button class="primary" style="max-width:230px" onclick="doLogin()">Sign in</button>
</section>

<!-- ============ APP SHELL ============ -->
<div id="view-app" class="hidden">
  <header class="app">
    <button id="backbtn" class="back hidden" onclick="goBack()" aria-label="Back">‹</button>
    <img src="logo.png" class="hlogo" alt="">
    <h1 id="title">Inventory</h1>
    <button class="opsbtn" onclick="leaveToOps()">Ops</button>
    <span id="chip" class="ok">✓</span>
  </header>
  <div id="zonebanner" class="hidden"></div>
  <main id="content"></main>
</div>

<!-- ============ KEYPAD ============ -->
<div id="keypad" class="overlay hidden" onclick="if(event.target===this)kpCancel()">
  <div class="sheet">
    <div class="kp-head"><div class="nm" id="kp-name"></div><div class="pv" id="kp-prev"></div></div>
    <div class="kp-entry" id="kp-entry">0</div>
    <div class="tenths" id="kp-tenths"></div>
    <div class="kp-grid">
      <button onclick="kpDigit('1')">1</button><button onclick="kpDigit('2')">2</button><button onclick="kpDigit('3')">3</button>
      <button onclick="kpDigit('4')">4</button><button onclick="kpDigit('5')">5</button><button onclick="kpDigit('6')">6</button>
      <button onclick="kpDigit('7')">7</button><button onclick="kpDigit('8')">8</button><button onclick="kpDigit('9')">9</button>
      <button onclick="kpDot()">.</button><button onclick="kpDigit('0')">0</button><button onclick="kpBack()">⌫</button>
    </div>
    <div class="kp-actions">
      <button class="ghost" onclick="kpCancel()">Cancel</button>
      <button class="primary" onclick="kpSave()">Save</button>
    </div>
  </div>
</div>

<!-- ============ RE-LOGIN OVERLAY (token expired mid-work) ============ -->
<div id="reauth" class="overlay hidden">
  <div class="sheet" style="border-radius:18px; margin:auto; max-width:360px;">
    <h2 class="sec" style="text-align:center">Session expired</h2>
    <p class="small muted" style="text-align:center; margin-top:-6px;">Your count is safe on this phone.<br>Enter your PIN to keep going.</p>
    <input id="repin" class="pin-input" style="width:100%" type="tel" inputmode="numeric" maxlength="5" placeholder="•••••">
    <div id="reauth-err" class="err"></div>
    <button class="primary" onclick="doReauth()">Unlock</button>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div id="modal" class="overlay hidden" onclick="if(event.target===this)closeModal()">
  <div class="sheet" id="modal-body" style="border-radius:18px; margin:auto; max-height:86vh; overflow-y:auto;"></div>
</div>

<script>
'use strict';
/* ===========================================================================
   BON SAKE BAR INVENTORY — FRONTEND
   Self-contained page. Shares nothing with index.html except the domain,
   the service worker, and the login session hand-off.

   SETUP: after deploying BonSakeInvApp.gs as a web app, paste its URL into
   BACKEND_URL below. While it still says PASTE_..., the page runs in DEMO
   MODE with sample data so the screens can be tried without a backend.

   Never change the write Content-Type from text/plain — Apps Script cannot
   answer a CORS preflight and every save would break.
=========================================================================== */
const BACKEND_URL      = 'https://script.google.com/macros/s/AKfycbxTcvecuuWjg3oXygP3fali1CWgbuZZe31hy1a65YZ-JgiJtePvZ3F3-88nliOAZE0e/exec';
const FRONTEND_VERSION = 'inv-fe-1.2.0';
const EXPECTED_BACKEND = 'bonsake-inv-1.0.2';
const DEMO = !/^https:/.test(BACKEND_URL);

const LS = {
  auth:   'bonsake_inv_auth',
  boot:   'bonsake_inv_boot',
  counts: 'bonsake_inv_counts',
  outbox: 'bonsake_inv_outbox',
  started:'bonsake_inv_count_started',
  usage:  'bonsake_inv_usage',
  lastOrder: 'bonsake_inv_last_order'
};
const FLUSH_DEBOUNCE_MS = 1200;
const FLUSH_RETRY_MAX_MS = 60000;
const BATCH_MAX = 50;
const ZONE_STYLE = { Z1:{bg:'var(--z1)',soft:'var(--z1-soft)'}, Z2:{bg:'var(--z2)',soft:'var(--z2-soft)'} };
const CATEGORY_ORDER = ['Beer','Vodka','Whiskey','Rum','Tequila','Gin','Sake','Wine - White','Wine - Red','Wine - Bubbles','Liqueur','Additives','Supplies','Liquor'];

function lsGet(key, fallback){ try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e){ return fallback; } }
function lsSet(key, value){ try { localStorage.setItem(key, JSON.stringify(value)); } catch(e){ reportError('ls:'+key, e); } }
function lsDel(key){ try { localStorage.removeItem(key); } catch(e){} }

/* ---------------- State ---------------- */
const S = {
  auth: lsGet(LS.auth, null),          // { token, user:{first_name,last_name,role} }
  boot: lsGet(LS.boot, null),          // { products, zones, counts, snapshots, deliveries, deliveryLines, lastSnapshotLines }
  counts: lsGet(LS.counts, {}),        // "pid|zid" -> { qty, ts }  (local truth, includes unsynced)
  outbox: lsGet(LS.outbox, []),        // [{ productId, zoneId, qty, clientTs }] one entry per pid|zid (absolute values)
  countStartedAt: lsGet(LS.started, null),
  view: 'home', backStack: [],
  zone: null,
  inflight: false, waitingSignal: false, flushTimer: null, backoff: 2000,
  countSearch: '',
  selectMode: false, selected: {}, selDist: '',
  lastOrder: lsGet('bonsake_inv_last_order', null)
};

/* ---------------- Tiny helpers ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nowIso(){ return new Date().toISOString(); }
function fmtQty(q){ const n = Number(q); if (!isFinite(n)) return '–'; return (Math.round(n*100)/100).toString(); }
function toast(msg, ms){ const t = document.createElement('div'); t.className='toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms || 2400); }
// AUTH failures already opened the re-login overlay; everything else here is a network miss.
function offlineToast(e, msg){ if (String(e && e.message) !== 'AUTH') toast(msg, 3400); }
function myName(){ return S.auth && S.auth.user ? (S.auth.user.first_name + ' ' + S.auth.user.last_name).trim() : ''; }
function products(){ return (S.boot && S.boot.products || []).filter(p => p.Active === 'Y'); }
function zones(){ return (S.boot && S.boot.zones || []).filter(z => z.Active === 'Y').sort((a,b)=>Number(a.SortOrder)-Number(b.SortOrder)); }
function zoneById(id){ return (S.boot && S.boot.zones || []).find(z => z.ZoneID === id); }
function productById(id){ return (S.boot && S.boot.products || []).find(p => p.ProductID === id); }
function zoneStyle(id){
  return ZONE_STYLE[id] || { bg:'#7c3aed', soft:'var(--accent-soft)' };  // zones added in-app after Z2
}
function reportError(where, err){
  try { if (S.auth) apiPost('logError', { where: where, what: String(err && err.message || err).slice(0,300) }).catch(()=>{}); } catch(e){}
}

/* ---------------- Backend calls ---------------- */
function apiFetch(url, opts){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 20000);
  opts = opts || {}; opts.signal = ctrl.signal;
  return fetch(url, opts).finally(()=>clearTimeout(timer));
}
async function apiPost(action, data){                       // writes (POST text/plain)
  if (DEMO) return demoApi(action, data || {});
  const body = JSON.stringify({ action: action, token: S.auth && S.auth.token, data: data || {},
                                pin: data && data.pin, first: data && data.first, last: data && data.last });
  const res = await apiFetch(BACKEND_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: body });
  const out = await res.json();
  if (out && out.error === 'AUTH') { authExpired(); throw new Error('AUTH'); }
  return out;
}
async function apiGet(action, params){                  // reads (GET)
  if (DEMO) return demoApi(action, params || {});
  const qs = new URLSearchParams(Object.assign({ action: action, token: S.auth && S.auth.token || '' }, params || {}));
  const res = await apiFetch(BACKEND_URL + '?' + qs.toString());
  const out = await res.json();
  if (out && out.error === 'AUTH') { authExpired(); throw new Error('AUTH'); }
  return out;
}

/* ---------------- Auth ---------------- */
async function doLogin(){
  const pin = $('pin').value.trim();
  const first = $('pin-first').value.trim(), last = $('pin-last').value.trim();
  $('login-err').textContent = '';
  try {
    const r = await apiPost('login', { pin: pin, first: first, last: last });
    if (r && r.success) {
      S.auth = { token: r.token, user: r.user }; lsSet(LS.auth, S.auth);
      showApp(); await refreshBoot(true);
    } else if (r && r.need_name) {
      $('namerow').classList.remove('hidden');
      $('login-err').textContent = 'Add your first and last name.';
    } else {
      $('login-err').textContent = (r && r.error) || 'Wrong PIN.';
    }
  } catch(e) {
    $('login-err').textContent = navigator.onLine ? 'Could not reach the server.' : 'No connection. Try again with signal.';
  }
}
function authExpired(){
  if (S.auth) { S.auth.token = ''; lsSet(LS.auth, S.auth); }
  $('reauth').classList.remove('hidden');
}
async function doReauth(){
  const pin = $('repin').value.trim();
  $('reauth-err').textContent = '';
  try {
    const r = await apiPost('login', { pin: pin, first: S.auth && S.auth.user && S.auth.user.first_name, last: S.auth && S.auth.user && S.auth.user.last_name });
    if (r && r.success) {
      S.auth = { token: r.token, user: r.user }; lsSet(LS.auth, S.auth);
      $('reauth').classList.add('hidden'); $('repin').value = '';
      toast('Signed back in'); scheduleFlush(300);
    } else { $('reauth-err').textContent = (r && r.error) || 'Wrong PIN.'; }
  } catch(e) { $('reauth-err').textContent = 'Could not reach the server.'; }
}
// Same-tab hand-off from the training app: it keeps {first,last,pin} in
// sessionStorage, which survives navigation within the tab.
async function tryHandoff(){
  let sess = null;
  try { sess = JSON.parse(sessionStorage.getItem('bonsake_session') || 'null'); } catch(e){}
  if (!sess || !sess.pin) return false;
  try {
    const r = await apiPost('login', { pin: String(sess.pin), first: sess.first || '', last: sess.last || '' });
    if (r && r.success) { S.auth = { token: r.token, user: r.user }; lsSet(LS.auth, S.auth); return true; }
  } catch(e){}
  return false;
}

/* ---------------- Boot data ---------------- */
async function refreshBoot(showErrors){
  try {
    const b = await apiGet('boot');
    if (!b || b.ok === false) throw new Error(b && b.error || 'boot failed');
    // Merge server counts into local truth. A key with a pending unsynced
    // entry keeps its local value; everything else takes the server's.
    const pendingKeys = {}; S.outbox.forEach(e => pendingKeys[e.productId + '|' + e.zoneId] = true);
    const merged = {};
    (b.counts || []).forEach(c => {
      const key = c.ProductID + '|' + c.ZoneID;
      merged[key] = { qty: Number(c.Qty) || 0, ts: c.LastUpdated || '' };
    });
    Object.keys(S.counts).forEach(key => { if (pendingKeys[key]) merged[key] = S.counts[key]; });
    S.counts = merged; lsSet(LS.counts, S.counts);
    S.boot = b; lsSet(LS.boot, b);
    render();
    checkBackendVersion();
  } catch(e) {
    if (showErrors) toast(navigator.onLine ? 'Could not load data. Using what is saved on this phone.' : 'Offline. Using data saved on this phone.', 3200);
  }
}
async function checkBackendVersion(){
  try {
    const p = await apiGet('ping');
    if (p && p.version && p.version !== EXPECTED_BACKEND) {
      showBanner('version', 'warn', 'App and server versions do not match (' + esc(p.version) + '). Tell Steven before counting.');
    }
  } catch(e){}
}

/* ---------------- Counting (local-first) ---------------- */
function countKey(pid, zid){ return pid + '|' + zid; }
function localQty(pid, zid){ const c = S.counts[countKey(pid,zid)]; return c ? c.qty : null; }

function setLocalCount(pid, zid, qty){
  const ts = nowIso();
  S.counts[countKey(pid,zid)] = { qty: qty, ts: ts }; lsSet(LS.counts, S.counts);
  // One outbox entry per product+zone: values are absolute, so only the
  // newest matters — this also keeps queue flushes small.
  S.outbox = S.outbox.filter(e => !(e.productId === pid && e.zoneId === zid));
  S.outbox.push({ productId: pid, zoneId: zid, qty: qty, clientTs: ts });
  lsSet(LS.outbox, S.outbox);
  if (!S.countStartedAt) { S.countStartedAt = ts; lsSet(LS.started, ts); }
  updateChip(); scheduleFlush(FLUSH_DEBOUNCE_MS);
}

function scheduleFlush(delayMs){
  clearTimeout(S.flushTimer);
  S.flushTimer = setTimeout(flushOutbox, delayMs);
}
async function flushOutbox(){
  if (S.inflight || S.outbox.length === 0 || !S.auth || !S.auth.token) { updateChip(); return; }
  S.inflight = true; updateChip();
  const batch = S.outbox.slice(0, BATCH_MAX);
  try {
    const r = await apiPost('setCounts', { entries: batch });
    if (r && r.ok) {
      // Drop only entries the user has not re-edited while this was in flight.
      const sent = {}; batch.forEach(e => sent[e.productId + '|' + e.zoneId] = e.clientTs);
      S.outbox = S.outbox.filter(e => sent[e.productId + '|' + e.zoneId] !== e.clientTs);
      lsSet(LS.outbox, S.outbox);
      S.backoff = 2000; S.waitingSignal = false;
      if (r.skippedStale && r.skippedStale.length) refreshBoot(false);  // someone else counted newer — reconcile
      if (S.outbox.length) scheduleFlush(200);
    } else if (r && r.retryable) {
      S.backoff = Math.min(S.backoff * 2, FLUSH_RETRY_MAX_MS); scheduleFlush(S.backoff);
    } else if (r && r.error) {
      reportError('flush', new Error(r.error)); toast('Save problem: ' + r.error, 4000);
      S.backoff = Math.min(S.backoff * 2, FLUSH_RETRY_MAX_MS); scheduleFlush(S.backoff);
    }
  } catch(e) {
    if (String(e.message) !== 'AUTH') {
      S.waitingSignal = true;
      S.backoff = Math.min(S.backoff * 2, FLUSH_RETRY_MAX_MS); scheduleFlush(S.backoff);
    }
  } finally {
    S.inflight = false; updateChip();
  }
}
function updateChip(){
  const chip = $('chip'); if (!chip) return;
  const n = S.outbox.length;
  if (n === 0) { chip.className = 'ok'; chip.textContent = 'All synced ✓'; }
  else if (S.inflight) { chip.className = 'busy'; chip.textContent = n + ' saving…'; }
  else if (S.waitingSignal || !navigator.onLine) { chip.className = 'wait'; chip.textContent = n + ' waiting for signal ⚠'; }
  else { chip.className = 'busy'; chip.textContent = n + ' queued…'; }
}

/* ---------------- Keypad ---------------- */
let KP = { pid:null, entry:'' };
function openKeypad(pid){
  const p = productById(pid); if (!p) return;
  KP.pid = pid; KP.entry = '';
  $('kp-name').textContent = p.Name;
  const prev = localQty(pid, S.zone);
  $('kp-prev').textContent = (prev === null ? 'not counted here yet' : 'currently ' + fmtQty(prev) + ' ' + (p.Unit || ''));
  // Case-counted products get quarter buttons (1 case + half a loose case
  // = 1 then .5); everything else gets tenths for open bottles.
  const isCase = /^(cs|case|cases)$/i.test(String(p.Unit || '').trim());
  const quick = $('kp-tenths'); quick.innerHTML = '';
  quick.classList.toggle('quarters', isCase);
  const fractions = isCase ? ['25', '5', '75'] : ['1','2','3','4','5','6','7','8','9'];
  fractions.forEach(function(f){
    const b = document.createElement('button'); b.textContent = '.' + f;
    b.onclick = function(){ kpFraction(f); };
    quick.appendChild(b);
  });
  kpPaint();
  $('keypad').classList.remove('hidden');
}
function kpPaint(){ $('kp-entry').textContent = KP.entry === '' ? '0' : KP.entry; }
function kpDigit(d){ if (KP.entry.replace('.','').length >= 5) return; if (KP.entry === '0') KP.entry = ''; KP.entry += d; kpPaint(); }
function kpDot(){ if (KP.entry.indexOf('.') !== -1) return; KP.entry = (KP.entry === '' ? '0' : KP.entry) + '.'; kpPaint(); }
function kpFraction(f){ const whole = KP.entry.split('.')[0] || '0'; KP.entry = whole + '.' + f; kpPaint(); }
function kpBack(){ KP.entry = KP.entry.slice(0, -1); kpPaint(); }
function kpCancel(){ $('keypad').classList.add('hidden'); }
function kpSave(){
  // Same rule as the backend's cleanQty: a blank never becomes 0.
  // Zeroing an item must be a deliberate "0" keystroke.
  if (KP.entry === '') { toast('Type a number first. Tap 0 to mean zero.'); return; }
  const n = Number(KP.entry);
  if (!isFinite(n) || n < 0 || n > 9999) { toast('Enter a number between 0 and 9999'); return; }
  setLocalCount(KP.pid, S.zone, Math.round(n*100)/100);
  $('keypad').classList.add('hidden');
  renderCountListOnly();
}

/* ---------------- Close-out ---------------- */
function lastSnapshotTotals(){
  const map = {};   // "pid|zid" -> qty at last close-out
  ((S.boot && S.boot.lastSnapshotLines) || []).forEach(l => { map[l.ProductID + '|' + l.ZoneID] = Number(l.Qty) || 0; });
  return map;
}
function renderCloseout(){
  if (S.outbox.length) {
    scheduleFlush(200);
    return '<div class="card"><b>' + S.outbox.length + ' count(s) still syncing…</b>' +
      '<div class="small muted">Everything must reach the sheet before a count can be finished. ' +
      (navigator.onLine ? 'Hang on a moment.' : 'You are offline. Walk to signal and this sends itself.') + '</div>' +
      '<button class="ghost" style="margin-top:10px" onclick="render()">Check again</button></div>';
  }
  const prev = lastSnapshotTotals();
  const zs = zones();
  let rows = '', flagged = 0, untouchedRows = '';
  products().forEach(p => {
    zs.forEach(z => {
      const key = countKey(p.ProductID, z.ZoneID);
      const cur = S.counts[key]; const was = prev[key];
      if (!cur && was === undefined) return;
      const q = cur ? cur.qty : 0;
      const w = was === undefined ? 0 : was;
      const delta = Math.round((q - w) * 100) / 100;
      const touchedThisCount = cur && S.countStartedAt && cur.ts >= S.countStartedAt;
      let flags = '';
      const par = Number(p.Par);
      if (w >= 1 && Math.abs(delta) >= 2 && Math.abs(delta) / w >= 0.5) { flags += '<span class="flag warn">big swing</span>'; flagged++; }
      if (isFinite(par) && par > 0 && q > par * 3) { flags += '<span class="flag warn">&gt;3× par</span>'; flagged++; }
      const line = '<tr><td>' + esc(p.Name) + ' <span class="small muted">' + esc((zoneById(z.ZoneID)||{}).Name || '') + '</span>' + flags + '</td>' +
                   '<td class="n">' + fmtQty(w) + '</td><td class="n"><b>' + fmtQty(q) + '</b></td>' +
                   '<td class="n" style="color:' + (delta < 0 ? 'var(--bad)' : delta > 0 ? 'var(--good)' : 'var(--muted)') + '">' + (delta > 0 ? '+' : '') + fmtQty(delta) + '</td></tr>';
      if (!touchedThisCount && w > 0) untouchedRows += line; else rows += line;
    });
  });
  let html = '<h2 class="sec">Review before finishing</h2>';
  if (flagged) html += '<p class="small" style="color:var(--warn)"><b>' + flagged + ' flag(s)</b> below. Worth a second look before you finish.</p>';
  html += '<div class="tscroll"><table><tr><th>Item</th><th class="n">Last</th><th class="n">Now</th><th class="n">Change</th></tr>' + (rows || '<tr><td colspan="4" class="muted">Nothing entered this count yet.</td></tr>') + '</table></div>';
  if (untouchedRows) html += '<h2 class="sec" style="font-size:15px;margin-top:16px">Had stock last count, not updated this time</h2><div class="tscroll"><table><tr><th>Item</th><th class="n">Last</th><th class="n">Now</th><th class="n">Change</th></tr>' + untouchedRows + '</table></div>';
  html += '<div class="field" style="margin-top:14px"><label>Note (optional)</label><input id="co-notes" placeholder="e.g. pre-weekend count"></div>';
  html += '<button class="primary" onclick="finishCount(false)">Build the order</button>';
  html += '<p class="small muted" style="margin-top:8px">This saves the count to Past, builds the order from your pars, and clears every count for the next inventory. Needs signal.</p>';
  return html;
}
// Order line: what to buy = par minus everything counted, all zones combined
// (counted 5, par 7, order 2). Only products with a par can make the order.
function buildOrderGroups(countsMap){
  const totals = {};
  Object.keys(countsMap).forEach(function(key){
    const pid = key.split('|')[0];
    totals[pid] = (totals[pid] || 0) + (Number(countsMap[key].qty) || 0);
  });
  const emailByName = {};
  const idByName = {};
  ((S.boot && S.boot.distributors) || []).forEach(function(d){
    const key = String(d.Name).trim().toLowerCase();
    emailByName[key] = String(d.Email || '').trim();
    idByName[key] = d.DistributorID;
  });
  const groups = {};
  let noPar = 0;
  products().forEach(function(p){
    const par = Number(p.Par);
    if (!isFinite(par) || par <= 0) { noPar++; return; }
    const need = Math.round((par - (totals[p.ProductID] || 0)) * 100) / 100;
    if (need <= 0) return;
    const dist = String(p.Distributor || '').trim() || 'No distributor set';
    (groups[dist] = groups[dist] || { name: dist, email: emailByName[dist.toLowerCase()] || '', distributorId: idByName[dist.toLowerCase()] || '', items: [] })
      .items.push({ name: p.Name, need: need, unit: p.Unit || '' });
  });
  return {
    groups: Object.keys(groups).sort().map(function(k){ return groups[k]; }),
    noPar: noPar
  };
}
async function finishCount(force){
  if (S.outbox.length) { render(); return; }
  try {
    const r = await apiPost('finishCount', { notes: ($('co-notes') && $('co-notes').value.trim()) || '', force: !!force });
    if (r && r.ok) {
      // Build the order from the counts BEFORE clearing them; the snapshot
      // on the server is the permanent copy of the same numbers.
      const built = buildOrderGroups(S.counts);
      S.lastOrder = { snapshotId: r.snapshotId, when: nowIso(), groups: built.groups, noPar: built.noPar };
      lsSet(LS.lastOrder, S.lastOrder);
      S.counts = {}; lsSet(LS.counts, S.counts);
      S.countStartedAt = null; lsDel(LS.started);
      toast('Count #' + r.snapshotId + ' saved. Counts reset for next time.', 3400);
      refreshBoot(false);
      S.view = 'order'; S.backStack = ['home']; render();
    } else if (r && /already closed out/.test(String(r.error || ''))) {
      openModal('<h2 class="sec">Close out again?</h2><p class="small">' + esc(r.error) + '</p>' +
        '<button class="primary" onclick="closeModal();finishCount(true)">Yes, close out again</button>' +
        '<button class="ghost" style="margin-top:8px" onclick="closeModal()">Cancel</button>');
    } else toast((r && r.error) || 'Could not finish', 4200);
  } catch(e) { offlineToast(e, 'No connection. Building the order needs signal.'); }
}

/* ---------------- Service-worker update notice ---------------- */
function watchForUpdates(){
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('/sw.js').then(reg => {
    if (!reg) return;
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) {
          showBanner('update', 'info', 'Update available <button onclick="location.reload()">Tap to refresh</button>');
        }
      });
    });
  }).catch(()=>{});
}

    n++; products.push({ ProductID:'P'+String(n).padStart(3,'0'), Department:'Bar', Category:cat, Name:name, Unit: cat==='Supplies'?'ea':(cat==='Beer'?'cs':'btl'),
                         PurchaseUnit:'', PackSize:'', Par: (n%3===0? n%7+2 : ''), Price:'', Distributor: n%2 ? 'Republic' : 'Southern Glazer’s', Notes:'', Active:'Y', SortOrder:'' });
  }));
  const zonesRows = [ {ZoneID:'Z1',Name:'Behind the Bar',Department:'Bar',SortOrder:1,Active:'Y'}, {ZoneID:'Z2',Name:'Back Room Storage',Department:'Bar',SortOrder:2,Active:'Y'} ];
  const counts = []; const lastLines = [];
  products.forEach((p,i) => {
    const q1 = Math.round((i*0.7)%6*10)/10, q2 = (i%4);
    counts.push({ ProductID:p.ProductID, ZoneID:'Z1', Qty:q1, LastUpdated:'2026-09-08T20:00:00Z', UpdatedBy:'Zach Landon' });
    counts.push({ ProductID:p.ProductID, ZoneID:'Z2', Qty:q2, LastUpdated:'2026-09-08T20:00:00Z', UpdatedBy:'Zach Landon' });
    lastLines.push({ SnapshotID:1, ProductID:p.ProductID, ZoneID:'Z1', Qty:q1 });
    lastLines.push({ SnapshotID:1, ProductID:p.ProductID, ZoneID:'Z2', Qty:q2 });
  });
  const distributors = [
    { DistributorID:'D1', Name:'Republic', Email:'rep@republic.example', Active:'Y' },
    { DistributorID:'D2', Name:'Southern Glazer’s', Email:'', Active:'Y' }
  ];
  return { products: products, zones: zonesRows, counts: counts, distributors: distributors,
           snapshots: [{ SnapshotID:1, StartedAt:'2026-09-08T18:00:00Z', FinishedAt:'2026-09-08T20:30:00Z', Status:'closed', By:'Zach Landon', Notes:'demo' }],
           deliveries: [{ DeliveryID:1, Date:'2026-09-10T15:00:00Z', Vendor:'Republic', InvoiceNo:'', By:'Zach Landon', Note:'' }],
           deliveryLines: [{ DeliveryID:1, ProductID:'P001', Qty:24, UnitCost:'', Note:'' }],
           lastSnapshotLines: lastLines, nextId: n };
})();
function demoApi_(action, data){
  const db = DEMO_DB;
  if (action === 'ping') return { ok:true, version: EXPECTED_BACKEND };
  if (action === 'login') {
    if (String(data.pin) === '12345' || String(data.pin).length >= 4)
      return { success:true, ok:true, token:'demo', user:{ first_name:'Zach', last_name:'Landon', role:'bar manager' } };
    return { success:false, ok:false };
  }
  if (action === 'boot') return Object.assign({ ok:true }, db);
  if (action === 'snapshot') {
    const snap = db.snapshots.find(s => String(s.SnapshotID) === String(data.id));
    if (!snap) return { ok:false, error:'Count not found' };
    return { ok:true, snapshot: snap, lines: db.lastSnapshotLines.filter(l => String(l.SnapshotID) === String(data.id)) };
  }
  if (action === 'addDistributor') {
    const id = 'D' + (db.distributors.length + 1);
    db.distributors.push({ DistributorID:id, Name:data.name, Email:data.email || '', Active:'Y' });
    return { ok:true, distributorId:id };
  }
  if (action === 'updateDistributor') {
    const d = db.distributors.find(x => x.DistributorID === data.distributorId);
    if (!d) return { ok:false, error:'Distributor not found' };
    if (data.name !== undefined) d.Name = data.name;
    if (data.email !== undefined) d.Email = data.email;
    return { ok:true };
  }
  if (action === 'report') return { ready:false, message:'Demo mode. Usage appears after two real counts.' };
  if (action === 'setCounts') {
    (data.entries || []).forEach(e => {
      let row = db.counts.find(c => c.ProductID === e.productId && c.ZoneID === e.zoneId);
      if (row) { row.Qty = e.qty; row.LastUpdated = e.clientTs; } else db.counts.push({ ProductID:e.productId, ZoneID:e.zoneId, Qty:e.qty, LastUpdated:e.clientTs, UpdatedBy:'Zach Landon' });
    });
    return { ok:true, applied: (data.entries || []).length, skippedStale: [] };
  }
  if (action === 'addProduct') {
    db.nextId++; const id = 'P' + String(db.nextId).padStart(3,'0');
    db.products.push({ ProductID:id, Department:'Bar', Category:data.category || 'Liquor', Name:data.name, Unit:data.unit || 'btl', PurchaseUnit:'', PackSize:'', Par:'', Price:'', Distributor:'', Notes:'', Active:'Y', SortOrder:'' });
    return { ok:true, productId:id };
  }
  if (action === 'assignDistributor') {
    let updated = 0;
    (data.productIds || []).forEach(function (id) {
      const p = db.products.find(x => x.ProductID === id);
      if (p) { p.Distributor = data.distributor || ''; updated++; }
    });
    return { ok:true, updated: updated };
  }
  if (action === 'updateProduct') {
    const p = db.products.find(x => x.ProductID === data.productId);
    if (!p) return { ok:false, error:'Product not found' };
    if (data.name !== undefined) p.Name = data.name;
    if (data.category !== undefined) p.Category = data.category;
    if (data.unit !== undefined) p.Unit = data.unit;
    if (data.par !== undefined) p.Par = data.par;
    if (data.distributor !== undefined) p.Distributor = data.distributor;
    if (data.notes !== undefined) p.Notes = data.notes;
    if (data.active !== undefined) p.Active = data.active ? 'Y' : '';
    return { ok:true };
  }
  if (action === 'addZone') { const id = 'Z' + (db.zones.length + 1); db.zones.push({ ZoneID:id, Name:data.name, Department:'Bar', SortOrder:db.zones.length+1, Active:'Y' }); return { ok:true, zoneId:id }; }
  if (action === 'updateZone') {
    const z = db.zones.find(x => x.ZoneID === data.zoneId); if (!z) return { ok:false, error:'Zone not found' };
    if (data.name !== undefined) z.Name = data.name;
    if (data.sortOrder !== undefined) z.SortOrder = data.sortOrder;
    if (data.active !== undefined) z.Active = data.active ? 'Y' : '';
    return { ok:true };
  }
  if (action === 'addDelivery') {
    const id = db.deliveries.length + 1;
    db.deliveries.push({ DeliveryID:id, Date:nowIso(), Vendor:data.vendor || '', InvoiceNo:'', By:'Zach Landon', Note:data.note || '' });
    (data.lines || []).forEach(l => db.deliveryLines.push({ DeliveryID:id, ProductID:l.productId, Qty:l.qty, UnitCost:'', Note:'' }));
    return { ok:true, deliveryId:id };
  }
  if (action === 'deleteDelivery') {
    db.deliveries = db.deliveries.filter(d => String(d.DeliveryID) !== String(data.deliveryId));
    db.deliveryLines = db.deliveryLines.filter(l => String(l.DeliveryID) !== String(data.deliveryId));
    return { ok:true };
  }
  if (action === 'finishCount') {
    const id = db.snapshots.length + 1;
    db.lastSnapshotLines = db.counts.map(c => ({ SnapshotID:id, ProductID:c.ProductID, ZoneID:c.ZoneID, Qty:c.Qty }));
    db.snapshots.push({ SnapshotID:id, StartedAt:nowIso(), FinishedAt:nowIso(), Status:'closed', By:'Zach Landon', Notes:data.notes || '' });
    db.counts = [];
    return { ok:true, snapshotId:id };
  }
  if (action === 'logError') return { ok:true };
  return { ok:false, error:'Demo: unknown action ' + action };
}

/* ---------------- Start-up ---------------- */
window.addEventListener('online', () => { S.waitingSignal = false; scheduleFlush(300); updateChip(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { scheduleFlush(400); if (S.auth) refreshBoot(false); } });
window.addEventListener('error', e => reportError('window', e.error || e.message));

(async function init(){
  if (DEMO) showBanner('demo', 'demo', 'DEMO MODE. Not connected to a live sheet. Counts here are practice.');
  watchForUpdates();
  if (S.auth && S.auth.token) {
    showApp();
    if (S.outbox.length) { showBanner('unsent', 'bad', S.outbox.length + ' count(s) from last time have not synced yet. Keep the app open near signal. <button onclick="hideBanner(\'unsent\');scheduleFlush(200)">OK</button>'); }
    refreshBoot(false); scheduleFlush(800);
  } else {
    const handed = await tryHandoff();
    if (handed) { showApp(); refreshBoot(true); }
    else $('view-login').classList.remove('hidden');
  }
})();
</script>
